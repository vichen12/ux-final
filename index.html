<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Asesor de Estudio</title>
<meta name="description" content="Asesor de Estudio: la app que le dice al estudiante de primer año cómo estudiar, no solo cuándo. Prototipo funcional del proyecto final de Diseño UX-UI, Grupo C, UTN FRM.">
<meta name="theme-color" content="#0037b0">
<link rel="icon" href="assets/icon.svg">
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/shell.css">
</head>
<body>

<!-- la app: en escritorio con navegación lateral, en el celular con barra inferior -->
<div class="app" id="phone">
  <div id="phone-body"></div>
</div>

<!-- herramientas para la demostración en la defensa -->
<button class="demo-fab" id="demo-fab" aria-expanded="false" aria-controls="demo-panel">
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 3l14 9-14 9V3z"/></svg>
  <span>Recorrido</span>
</button>
<aside class="demo-panel" id="demo-panel" hidden>
  <div class="dp-head">
    <b>Recorrido del happy path</b>
    <button class="dp-close" data-demo-close aria-label="Cerrar">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <p class="dp-sub">Saltá a cualquier pantalla. Los datos son de prueba y viven en memoria.</p>
  <ol class="tour" id="tour"></ol>
  <div class="dp-actions">
    <button data-act="empezar-vacio">Recorrer desde cero</button>
    <button data-act="reiniciar-demo">Reiniciar datos</button>
  </div>
  <p class="dp-foot">Proyecto final de Diseño UX-UI · Grupo C «Figma locos» · UTN Facultad Regional Mendoza</p>
</aside>

<script src="js/vendor/gsap.min.js"></script>
<script src="js/vendor/chart.min.js"></script>
<script src="js/vendor/confetti.min.js"></script>
<script src="js/ui.js"></script>
<script src="js/data.js"></script>
<script src="js/planner.js"></script>
<script src="js/router.js"></script>
<script src="js/app.js"></script>
<script src="js/anim.js"></script>
<script src="js/screens/cuenta.js"></script>
<script src="js/screens/onboarding.js"></script>
<script src="js/screens/inicio.js"></script>
<script src="js/screens/materias.js"></script>
<script src="js/screens/calendario.js"></script>
<script src="js/screens/sesion.js"></script>
<script src="js/screens/quiz.js"></script>
<script src="js/screens/progreso.js"></script>
<script src="js/screens/perfil.js"></script>
<script>App.iniciar();</script>

</body>
</html>
